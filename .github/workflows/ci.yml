name: Secret demo
on: workflow_dispatch

jobs:
  secret-demo:
    runs-on: ubuntu-latest
    env:
      DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
    steps:
      - name: Vérifier que le secret existe
        run: |
          if [ -z "$DEMO_TOKEN" ]; then
            echo "Le secret DEMO_TOKEN est vide ou absent"
            exit 1
          fi

      - name: Afficher la longueur du secret
        run: echo "Longueur du secret : ${#DEMO_TOKEN}"

      - name: Essayer d'afficher la valeur
        run: echo "Valeur : $DEMO_TOKEN"

      - name: Afficher la variable APP_ENV
        run: echo "APP_ENV = ${{ vars.APP_ENV }}"
